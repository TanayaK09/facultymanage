{% load static %}

<!DOCTYPE html>

<html lang="en" class="page-faculty-login">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Login - FMS</title>
    <link rel="stylesheet" href="{% static 'style.css' %}?v=4">
</head>

<body class="page-faculty-login">
<div class="login-box">

    <h1>Faculty Login</h1>

    <p>Faculty Management System</p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label for="faculty_id">Faculty ID</label>
            <input
                type="text"
                id="faculty_id"
                name="faculty_id"
                placeholder="Enter Faculty ID"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter Password"
                required
            >
        </div>

        <button type="submit" class="login-btn">
            Login
        </button>
    </form>

    <a href="{% url 'login' %}" class="back-link">
        Back to Admin Login
    </a>

</div>

</body>
</html>
