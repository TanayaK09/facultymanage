{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Faculty Management System</title>

    <link rel="stylesheet" href="{% static 'style.css' %}?v=4">

</head>

<body class="login-page">

    <div class="login-box">

        <div class="login-header">

            <img
                class="brand-logo"
                src="{% static 'tuition-logo.png' %}"
                alt="Mervin Sir's Group Tuitions logo">

            <div class="logo">
                Mervin Sir's Group Tution
            </div>

            <div class="subtitle">
                Faculty Management System
            </div>

        </div>


        <div class="login-tabs">

            <button
                type="button"
                id="adminTab"
                class="active"
                onclick="showLogin('admin')">

                Admin

            </button>


            <button
                type="button"
                id="facultyTab"
                onclick="showLogin('faculty')">

                Faculty

            </button>

        </div>


        {% if messages %}

        <div class="messages">

            {% for message in messages %}

            <div class="error-message">

                {{ message }}

            </div>

            {% endfor %}

        </div>

        {% endif %}


        <div
            class="login-form"
            id="adminLogin">

            <h3>Admin Login</h3>

            <form method="POST">

                {% csrf_token %}

                <div class="form-group">

                    <label>
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        placeholder="Enter admin username"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <div class="password-input-wrap">
                        <input
                            type="password"
                            name="password"
                            placeholder="Enter password"
                            required>
                        <button
                            type="button"
                            class="password-toggle"
                            aria-label="Show password"
                            aria-pressed="false">
                            <svg class="password-eye-open" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="password-eye-closed" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M3 3l18 18"></path>
                                <path d="M10.6 5.1A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a16 16 0 0 1-3.1 3.9"></path>
                                <path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.4 10.4 0 0 0 4-.8"></path>
                                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
                            </svg>
                        </button>
                    </div>

                </div>


                <button
                    type="submit"
                    class="login-button">

                    Login

                </button>

            </form>


            <div class="register-link">

                <a href="{% url 'admin_register' %}">
                    Register Admin
                </a>

            </div>

        </div>


        <div
            class="login-form"
            id="facultyLogin"
            style="display: none;">

            <h3>Faculty Login</h3>

            <form method="POST">

                {% csrf_token %}

                <div class="form-group">

                    <label>
                        Faculty ID
                    </label>

                    <input
                        type="text"
                        name="username"
                        placeholder="Enter Faculty ID"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <div class="password-input-wrap">
                        <input
                            type="password"
                            name="password"
                            placeholder="Enter password"
                            required>
                        <button
                            type="button"
                            class="password-toggle"
                            aria-label="Show password"
                            aria-pressed="false">
                            <svg class="password-eye-open" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="password-eye-closed" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M3 3l18 18"></path>
                                <path d="M10.6 5.1A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a16 16 0 0 1-3.1 3.9"></path>
                                <path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.4 10.4 0 0 0 4-.8"></path>
                                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
                            </svg>
                        </button>
                    </div>

                </div>


                <button
                    type="submit"
                    class="login-button">

                    Login

                </button>

            </form>

        </div>

    </div>


    <script>

        function showLogin(type) {

            const adminLogin =
                document.getElementById("adminLogin");

            const facultyLogin =
                document.getElementById("facultyLogin");

            const adminTab =
                document.getElementById("adminTab");

            const facultyTab =
                document.getElementById("facultyTab");


            if (type === "admin") {

                adminLogin.style.display = "block";

                facultyLogin.style.display = "none";

                adminTab.classList.add("active");

                facultyTab.classList.remove("active");

            } else {

                adminLogin.style.display = "none";

                facultyLogin.style.display = "block";

                adminTab.classList.remove("active");

                facultyTab.classList.add("active");

            }

        }

        document.querySelectorAll(".login-tabs button, .login-box .login-button").forEach(function(button) {
            button.addEventListener("click", function(event) {
                const bounds = button.getBoundingClientRect();

                button.style.setProperty("--ripple-x", (event.clientX - bounds.left) + "px");
                button.style.setProperty("--ripple-y", (event.clientY - bounds.top) + "px");
                button.classList.remove("ripple-active");
                void button.offsetWidth;
                button.classList.add("ripple-active");

                window.setTimeout(function() {
                    button.classList.remove("ripple-active");
                }, 700);
            });
        });

        document.querySelectorAll(".password-toggle").forEach(function(toggle) {
            toggle.addEventListener("click", function() {
                const passwordInput = toggle.parentElement.querySelector("input");
                const showPassword = passwordInput.type === "password";

                passwordInput.type = showPassword ? "text" : "password";
                toggle.setAttribute("aria-pressed", String(showPassword));
                toggle.setAttribute("aria-label", showPassword ? "Hide password" : "Show password");
                passwordInput.focus();
            });
        });

    </script>

</body>

</html>
