{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Update Faculty - Faculty Management System</title>

    <link rel="stylesheet" href="{% static 'style.css' %}?v=4">

</head>

<body>

<div class="dashboard-container">

    <aside class="sidebar">

        <div class="sidebar-header">
            <h2>Faculty Management</h2>
        </div>

        <ul class="sidebar-menu">

            <li>
                <a href="{% url 'dashboard' %}">
                    Dashboard
                </a>
            </li>

            <li>
                <a href="{% url 'manage_faculty' %}" class="active">
                    Manage Faculty
                </a>
            </li>
             <li>
                <a href="{% url 'schedule' %}">
                    Schedule
                </a>
            </li>

            <li>
                <a href="{% url 'attendance' %}">
                    Attendance
                </a>
            </li>

            <li>
                <a href="{% url 'salary' %}">
                    Salary
                </a>
            </li>

           
            <li>
                <a href="{% url 'logout' %}">
                    Logout
                </a>
            </li>

        </ul>

    </aside>


    <main class="main-content">

        <div class="form-container">

            <div class="form-card">

                <h2>Update Faculty</h2>

                <form method="POST">

                    {% csrf_token %}


                    <div class="form-group">

                        <label for="faculty_id">
                            Faculty ID
                        </label>

                        <input
                            type="text"
                            id="faculty_id"
                            value="{{ faculty.FacultyID }}"
                            readonly
                        >

                    </div>


                    <div class="form-row">

                        <div class="form-group">

                            <label for="first_name">
                                First Name
                            </label>

                            <input
                                type="text"
                                id="first_name"
                                name="first_name"
                                value="{{ faculty.FirstName }}"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="last_name">
                                Last Name
                            </label>

                            <input
                                type="text"
                                id="last_name"
                                name="last_name"
                                value="{{ faculty.LastName }}"
                                required
                            >

                        </div>

                    </div>


                    <div class="form-row">

                        <div class="form-group">

                            <label for="gender">
                                Gender
                            </label>

                            <select
                                id="gender"
                                name="gender"
                                required
                            >

                                <option value="">
                                    Select Gender
                                </option>

                                <option
                                    value="Male"
                                    {% if faculty.Gender == "Male" %}selected{% endif %}
                                >
                                    Male
                                </option>

                                <option
                                    value="Female"
                                    {% if faculty.Gender == "Female" %}selected{% endif %}
                                >
                                    Female
                                </option>

                                <option
                                    value="Other"
                                    {% if faculty.Gender == "Other" %}selected{% endif %}
                                >
                                    Other
                                </option>

                            </select>

                        </div>


                        <div class="form-group">

                            <label for="dob">
                                Date of Birth
                            </label>

                            <input
                                type="date"
                                id="dob"
                                name="dob"
                                value="{{ faculty.DOB|date:'Y-m-d' }}"
                                required
                            >

                        </div>

                    </div>


                    <div class="form-row">

                        <div class="form-group">

                            <label for="email">
                                Email
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                value="{{ faculty.Email }}"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="contact_number">
                                Contact Number
                            </label>

                            <input
                                type="text"
                                id="contact_number"
                                name="contact_number"
                                value="{{ faculty.ContactNumber }}"
                                maxlength="10"
                                required
                            >

                        </div>

                    </div>


                    <div class="form-group">

                        <label for="address">
                            Address
                        </label>

                        <textarea
                            id="address"
                            name="address"
                            required
                        >{{ faculty.Address }}</textarea>

                    </div>


                    <div class="form-row">

                        <div class="form-group">

                            <label for="qualification">
                                Qualification
                            </label>

                            <input
                                type="text"
                                id="qualification"
                                name="qualification"
                                value="{{ faculty.Qualification }}"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="designation">
                                Subject
                            </label>

                            <input
                                type="text"
                                id="designation"
                                name="designation"
                                value="{{ faculty.Designation }}"
                                required
                            >

                        </div>

                    </div>


                    <div class="form-row">

                        <div class="form-group">

                            <label for="joining_date">
                                Joining Date
                            </label>

                            <input
                                type="date"
                                id="joining_date"
                                name="joining_date"
                                value="{{ faculty.JoiningDate|date:'Y-m-d' }}"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="experience">
                                Experience (Years)
                            </label>

                            <input
                                type="number"
                                id="experience"
                                name="experience"
                                min="0"
                                step="0.1"
                                value="{{ faculty.Experience }}"
                                required
                            >

                        </div>

                    </div>


                    <div class="form-group">

                        <label for="status">
                            Status
                        </label>

                        <select
                            id="status"
                            name="status"
                            required
                        >

                            <option value="">
                                Select Status
                            </option>

                            <option
                                value="Active"
                                {% if faculty.Status == "Active" %}selected{% endif %}
                            >
                                Active
                            </option>

                            <option
                                value="Inactive"
                                {% if faculty.Status == "Inactive" %}selected{% endif %}
                            >
                                Inactive
                            </option>

                        </select>

                    </div>


                    <div class="action-buttons">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Update Faculty
                        </button>

                        <a
                            href="{% url 'manage_faculty' %}"
                            class="btn btn-warning"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </main>

</div>

</body>

</html>
